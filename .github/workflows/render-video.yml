name: Render explainer video

on:
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Python deps
        run: pip install edge-tts pydub

      - name: Prepare output dir
        run: mkdir -p out

      - name: Generate voiceover + scene timings
        run: python tts.py

      - name: Record the animation (captures real scene timings)
        run: |
          node render.js
          f=$(ls out/*.webm | head -n1); mv "$f" out/video.webm
          ls -la out

      - name: Assemble narration (synced to recording)
        run: python assemble_audio.py

      - name: Build music, mix audio, mux final MP4
        run: |
          T=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/video.webm)
          echo "video length = $T"

          # warm ambient pad (root/fifth/octave), length of the video
          ffmpeg -y \
            -f lavfi -i "sine=frequency=165:duration=$T" \
            -f lavfi -i "sine=frequency=247:duration=$T" \
            -f lavfi -i "sine=frequency=330:duration=$T" \
            -filter_complex "[0][1][2]amix=inputs=3:normalize=0,volume=0.3,tremolo=f=0.10:d=0.35,aecho=0.8:0.85:900:0.22,lowpass=f=1300[m]" \
            -map "[m]" -ac 2 out/music.wav

          FO=$(awk "BEGIN{print $T-3}")
          ffmpeg -y -i out/video.webm -i out/narration.wav -i out/music.wav \
            -filter_complex "[2:a]volume=0.12,afade=t=in:st=0:d=2,afade=t=out:st=$FO:d=3[mus];[1:a]volume=1.2,aresample=44100[voc];[voc][mus]amix=inputs=2:normalize=0:duration=longest[mix]" \
            -map 0:v -map "[mix]" -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium \
            -c:a aac -b:a 192k -movflags +faststart -shortest out/zibrand-drop-alert.mp4
          ls -la out

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: zibrand-drop-alert-video
          path: video/out/zibrand-drop-alert.mp4
          if-no-files-found: error
