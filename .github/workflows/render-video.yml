name: Render explainer video

on:
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record the explainer
        run: |
          mkdir -p out
          node render.js
          ls -la out

      - name: Convert to MP4 (H.264)
        run: |
          f=$(ls out/*.webm | head -n1)
          echo "Recorded file: $f"
          ffmpeg -y -i "$f" -vf "fps=30,format=yuv420p" -c:v libx264 -preset medium -crf 20 -movflags +faststart out/zibrand-drop-alert.mp4
          ls -la out

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: zibrand-drop-alert-video
          path: video/out/zibrand-drop-alert.mp4
          if-no-files-found: error
